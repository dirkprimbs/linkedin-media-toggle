<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 12px 14px;
      min-width: 220px;
      font: 14px/1.4 system-ui, sans-serif;
    }
    h1 { font-size: 13px; font-weight: 600; margin: 0 0 8px; opacity: 0.7; }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 6px 0;
      cursor: pointer;
    }
    kbd { font: 11px system-ui, sans-serif; opacity: 0.6; }
    /* A plain checkbox drawn as a switch. */
    input {
      appearance: none;
      flex: none;
      width: 34px;
      height: 20px;
      margin: 0;
      border-radius: 10px;
      background: #999;
      position: relative;
      cursor: pointer;
      transition: background 0.15s;
    }
    input::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
    }
    input:checked { background: #0a66c2; }
    input:checked::after { transform: translateX(14px); }
    input:focus-visible { outline: 2px solid #0a66c2; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Show in the LinkedIn feed</h1>
  <label>
    <span>Post images <kbd>Alt+Shift+P</kbd></span>
    <input type="checkbox" id="images">
  </label>
  <label>
    <span>Post videos <kbd>Alt+Shift+V</kbd></span>
    <input type="checkbox" id="videos">
  </label>
  <script src="popup.js"></script>
</body>
</html>
